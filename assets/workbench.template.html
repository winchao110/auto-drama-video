<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · 短剧工作台</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#f4f4f1;--panel:#fff;--ink:#1b1d22;--muted:#71767f;--line:#e6e6e0;
    --accent:#c0392b;--accent-soft:#fbeae7;--ok:#2f6f5e;--ok-soft:#e8f2ee;
    --en:#3b4a5a;--en-soft:#f2f5f8;
    --side:#15171b;--side-ink:#e9e9e5;--side-muted:#8d9096;
  }
  html,body{margin:0;padding:0;min-height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #app{display:flex;min-height:100vh}
  aside{width:236px;flex:0 0 236px;background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
  .brand{padding:22px 20px 10px;font-size:11px;letter-spacing:.24em;color:var(--side-muted);text-transform:uppercase}
  .proj{padding:0 20px 18px;font-size:16px;font-weight:600;line-height:1.4;word-break:break-word}
  nav{padding:6px 10px;flex:1}
  nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--side-ink);padding:11px 12px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}
  nav button:hover{background:#1f2228}
  nav button.on{background:var(--accent);color:#fff}
  nav button .dot{width:6px;height:6px;border-radius:50%;background:#3a3f47;flex:0 0 6px}
  nav button.on .dot{background:#fff}
  .sidefoot{padding:14px 20px 20px;font-size:11px;color:var(--side-muted);border-top:1px solid #24272d;line-height:1.75}
  .sidefoot b{color:#c9cbcf;font-weight:500}
  .sideby{padding:0 20px 18px;font-size:10px;line-height:1.6;color:#565b63;letter-spacing:.04em;user-select:text}
  .sidehelp{margin:0 14px 12px;padding:12px 13px 11px;border-radius:10px;background:#101216;border:1px solid #24272d;font-size:11px;color:var(--side-muted);line-height:1.7}
  .sidehelp .hd{font-size:10px;letter-spacing:.18em;color:#9aa0a8;margin-bottom:8px;text-transform:uppercase}
  .sidehelp ol{margin:0;padding-left:16px}
  .sidehelp li{margin-bottom:8px}
  .sidehelp li:last-child{margin-bottom:0}
  .sidehelp b{color:#e2e3e0;font-weight:600}
  main{flex:1;min-width:0;padding-bottom:90px}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(244,244,241,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 32px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .topbar .stat{font-size:12px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
  .topbar .stat b{color:var(--ink);font-weight:600}
  .spacer{flex:1}
  .savebtn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:9px 18px;font:inherit;font-size:13px;cursor:pointer}
  .savebtn:hover{background:#000}
  .dirty{font-size:12px;color:var(--accent);display:none}
  .dirty.on{display:inline}
  .page{padding:26px 32px;max-width:1240px}
  .pagehead h2{margin:0 0 4px;font-size:22px}
  .pagehead .sub{margin:0 0 18px;color:var(--muted);font-size:13px;max-width:900px}
  .flowbar{display:flex;margin-bottom:20px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
  .flowbar div{flex:1;padding:9px 8px;text-align:center;font-size:12px;color:var(--muted);border-right:1px solid var(--line)}
  .flowbar div:last-child{border-right:0}
  .flowbar div.done{background:var(--ok-soft);color:var(--ok)}
  .flowbar div.cur{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
  .card>h3{margin:0 0 14px;font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:600}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  .field>label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .checkrow{display:flex;align-items:center;gap:9px;padding:9px 11px;background:#fbfbf9;border:1px solid var(--line);border-radius:8px;cursor:pointer}
  .checkrow input[type=checkbox]{width:16px;height:16px;margin:0;cursor:pointer;accent-color:var(--ink)}
  .checkrow span{font-size:13px;color:var(--ink)}
  .checkrow.off span{color:var(--muted)}
  input[type=text],input[type=number],textarea,select{width:100%;font:inherit;font-size:13.5px;line-height:1.7;color:var(--ink);background:#fbfbf9;border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;transition:.15s;resize:vertical}
  input:focus,textarea:focus,select:focus{border-color:#b9b9b0;background:#fff}
  textarea{min-height:60px}
  .hint{font-size:11.5px;color:#9a9a92;margin-top:5px;line-height:1.55}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer;text-decoration:none;transition:.15s}
  .btn:hover{border-color:#c9c9c0;background:#fafaf7}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#a83226}
  .btn.sm{padding:4px 9px;font-size:12px}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#f0f0ec;color:var(--muted);letter-spacing:.03em;white-space:nowrap}
  .tag.ok{background:var(--ok-soft);color:var(--ok)}
  .tag.warn{background:var(--accent-soft);color:var(--accent)}
  .tag.en{background:var(--en-soft);color:var(--en)}
  table{width:100%;border-collapse:collapse}
  th{font-size:11px;color:var(--muted);font-weight:500;text-align:left;padding:0 6px 6px;letter-spacing:.06em;white-space:nowrap}
  td{padding:6px;vertical-align:top;border-top:1px solid var(--line);font-size:13px}
  .ov th:first-child,.ov td:first-child{width:74px}
  .ov td:nth-child(3){width:120px}
  .agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(336px,1fr));gap:14px}
  .acard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .acard .thumb{height:186px;background:#f0f0ec center/cover no-repeat;position:relative;border-bottom:1px solid var(--line)}
  .acard .thumb .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#a8a8a0;font-size:12px;flex-direction:column;gap:2px}
  .acard .thumb .idx{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;padding:2px 7px;border-radius:20px;letter-spacing:.06em}
  .acard .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
  .acard .nm{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .acard textarea{font-size:12.5px;min-height:100px}
  .prow{display:flex;gap:10px}
  .prow .field{flex:1;margin:0}
  /* 配音面板 */
  .vgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .vrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:12px;background:#fcfcfa}
  .vrow .ava{width:56px;height:74px;flex:0 0 56px;border-radius:6px;background:#eee center/cover no-repeat;border:1px solid var(--line)}
  .vrow .vmain{flex:1;min-width:0}
  .vrow .vname{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .vrow .vname .role{font-weight:400;font-size:11.5px;color:var(--muted)}
  .vrow select{font-size:12.5px;padding:5px 8px}
  .vrow .vacts{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
  .vstate{font-size:11.5px;color:var(--muted)}
  .vstate.on{color:var(--ok)}
  /* 资产卡里的音色区 */
  .vcbox{border:1px dashed var(--line);border-radius:9px;padding:9px 10px;display:flex;flex-direction:column;gap:7px;background:#fafaf6}
  .vcbox .vchead{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.08em}
  .vcbox .vacts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .vcbox textarea{font-size:12px;min-height:62px}
  .vcbox .field{gap:4px}
  .vcbox label{font-size:11.5px;color:var(--muted)}
  /* 提示词页的音色总览 */
  .vsrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .vsitem{border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:flex;gap:10px;background:#fcfcfa;align-items:center}
  .vsitem .ava{width:44px;height:58px;flex:0 0 44px;border-radius:6px;background:#eee center/cover no-repeat;border:1px solid var(--line)}
  /* 提示词卡 */
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
  .pcard .hd{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);background:#fbfbf9;flex-wrap:wrap}
  .pcard .hd .id{font-weight:600;font-size:13.5px;letter-spacing:.03em}
  .pcard .hd .meta{font-size:12px;color:var(--muted)}
  .pcard .bd{padding:14px 16px}
  .refs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .refchip{display:flex;align-items:center;gap:7px;background:#f6f6f2;border:1px solid var(--line);border-radius:20px;padding:3px 10px 3px 3px;font-size:12px}
  .refchip img{width:24px;height:24px;border-radius:50%;object-fit:cover;background:#e2e2da}
  .refchip b{color:var(--accent);font-weight:600}
  .pair{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
  .pair .en{background:var(--en-soft);border-bottom:1px dashed var(--line);padding:10px 12px}
  .pair .en .lbl{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.12em;color:var(--en);margin-bottom:6px;text-transform:uppercase}
  .pair .en pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12px/1.62 ui-monospace,Consolas,"Courier New",monospace;color:#26313d}
  .pair .zh{padding:10px 12px 12px}
  .pair .zh .lbl{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.12em;color:var(--accent);margin-bottom:6px;text-transform:uppercase}
  .pair textarea{min-height:96px;font-size:13px}
  .pair .edited{background:var(--accent);color:#fff;border-radius:20px;padding:0 7px;font-size:10px;letter-spacing:.06em}
  .params{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .vcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .vcard .vwrap{aspect-ratio:9/16;max-height:520px;background:#0d0d0f;display:flex;align-items:center;justify-content:center;color:#5c5c5c;font-size:12px}
  .vcard video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
  .vcard .vb{padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px}
  .vcard .vb .id{font-weight:600}
  .finbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}
  .finbox video{width:100%;display:block;background:#000;max-height:70vh}
  .finbox .finhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;font-size:12.5px}
  .finbox .finhead .t{font-weight:600}
  .finbox .finhead .hint{margin:0}
  .banner{display:none;margin:10px 32px 0;padding:9px 14px;border-radius:8px;background:#fff4e5;border:1px solid #f0d9b5;color:#8a5a12;font-size:12.5px;align-items:center;gap:12px}
  .banner.on{display:flex}
  .banner.ok{background:var(--ok-soft);border-color:#cbe0d7;color:var(--ok)}
  #toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,16px);background:#1b1d22;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:72vw;text-align:center}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  .empty{color:var(--muted);font-size:13px;padding:28px;text-align:center;background:var(--panel);border:1px dashed var(--line);border-radius:12px}
  @media(max-width:880px){aside{display:none}.page{padding:18px 16px}.grid2{grid-template-columns:1fr}.topbar{padding:10px 16px}}
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand">Drama Workbench</div>
    <div class="proj">__TITLE__</div>
    <nav id="nav">
      <button data-page="synopsis"><span class="dot"></span>简介</button>
      <button data-page="assets"><span class="dot"></span>资产</button>
      <button data-page="prompts"><span class="dot"></span>视频提示词</button>
      <button data-page="final"><span class="dot"></span>成品</button>
    </nav>
    <div class="sidehelp">
      <div class="hd">三步走</div>
      <ol>
        <li><b>一</b> 按剧本 / 小说出资产提示词与视频提示词，你审完回「继续」</li>
        <li><b>二</b> 本地 Qwen-Image 2.1 出资产参考图，你审完回「继续」</li>
        <li><b>三</b> 本地 MiniMax H3 出视频，按顺序拼成片</li>
      </ol>
    </div>
    <div class="sidefoot">
      改完点「保存」，AI 会重读这一页继续往下做。<br>
      <b id="modeHint">—</b>
    </div>
    <div class="sideby">作者：太阳阶梯jqk8707</div>
  </aside>
  <main>
    <div class="topbar">
      <div class="stat" id="stat"></div>
      <div class="spacer"></div>
      <span class="dirty" id="dirty">● 有未保存修改</span>
      <button class="savebtn" id="saveAll">保存</button>
    </div>
    <div class="banner" id="banner"><span id="bannerTxt"></span><button class="btn sm" id="reloadBtn">重新载入</button></div>
    <div id="view"></div>
  </main>
</div>
<div id="toast"></div>
<script type="application/json" id="drama-state">__DRAMA_STATE__</script>
<script>
(function () {
  "use strict";
  var STATE = JSON.parse(document.getElementById("drama-state").textContent);
  var PROJECT_DIR = __PROJECT_DIR__;
  var SERVER = location.protocol === "http:" || location.protocol === "https:";
  var PAGES = ["synopsis", "assets", "prompts", "final"];
  var page = (location.hash || "").replace("#", "");
  if (PAGES.indexOf(page) < 0) page = "synopsis";
  var diskStamp = (STATE.meta && STATE.meta.updatedAt) || "";
  var isDirty = false;
  var runTimer = null;
  var showEn = true;
  var mergedView = true;
  var player = null;
  var playingId = "";

  var RATIOS = ["16:9", "9:16", "4:3", "3:4", "1:1", "21:9"];
  var SEED_MODES = [["fixed", "固定（种子不变）"], ["increment", "递增（每次 +1）"], ["decrement", "递减（每次 -1）"], ["randomize", "随机（每次换）"]];
  /* 模型选项全部来自已连接的 ComfyUI：unet=diffusion_models，lora=loras，clip=text_encoders，vae=vae
     规矩：下拉里只放 ComfyUI 此刻真实存在的文件；页面每次打开 / 切到这两页都重新读，绝不复用上次的列表。 */
  var MODELS = { unet: [], lora: [], clip: [], vae: [], error: "", loaded: false, ts: "" };
  var MODEL_DEFAULTS = __MODEL_DEFAULTS__;
  var MODEL_SLOT = { imgUnet: "unet", imgClip: "clip", imgVae: "vae",
                     h3Model: "unet", h3Lora: "lora", h3Clip: "clip",
                     h3VideoVae: "vae", h3AudioVae: "vae" };
  var MODEL_LABEL = { imgUnet: "生图 UNet", imgClip: "生图 CLIP", imgVae: "生图 VAE",
                      h3Model: "H3 主模型", h3Lora: "LoRA", h3Clip: "CLIP",
                      h3VideoVae: "视频 VAE", h3AudioVae: "音频 VAE" };
  var MODEL_FIXED = [];          /* 本轮读取判定为「已不存在」并自动改掉的项（明细） */
  function fixedNames() {
    return MODEL_FIXED.map(function (x) { return x.name; }).join("、");
  }
  function modelTip() {
    if (!MODELS.loaded) return "正在从已连接的 ComfyUI 读取模型列表…";
    if (MODELS.error) return "读取失败：" + MODELS.error + "。ComfyUI 起来后点「刷新模型列表」重读。";
    var s = "已从 ComfyUI 实时读取（" + (MODELS.ts || "刚刚") + "）：主模型 " + MODELS.unet.length +
      " / LoRA " + MODELS.lora.length + " / CLIP " + MODELS.clip.length + " / VAE " + MODELS.vae.length;
    if (MODEL_FIXED.length) s += "｜有 " + MODEL_FIXED.length + " 项已不在 ComfyUI（" + fixedNames() + "），已切到可用项，记得保存";
    return s;
  }
  function assetUrl(a) { return a.image ? (a.image + "?v=" + (a.imageVer || 0)) : ""; }
  function videoUrl(s) { return s.video ? (s.video + "?v=" + (s.videoVer || 0)) : ""; }
  /* 合并成片：全部段落跑完后自动生成，路径存在 meta.finalVideo */
  function finalUrl() {
    var m = STATE.meta || {};
    if (!m.finalVideo) return "";
    var t = String(m.finalVideoAt || "").replace(/[^0-9]/g, "");
    return m.finalVideo + "?v=" + (t || "1");
  }
  function finalSecs() {
    var s = (STATE.meta || {}).finalVideoSec;
    if (!s) return "";
    s = Number(s);
    return (Math.floor(s / 60) ? Math.floor(s / 60) + " 分 " : "") + (s % 60).toFixed(1) + " 秒";
  }
  /* 下拉选项：只给真实存在的模型；列表空（离线/读取失败）时给一条占位，绝不把旧值塞进列表 */
  function selOptions(list, emptyLabel) {
    if (!list || !list.length) return [["", emptyLabel || "（ComfyUI 里没读到模型）"]];
    return list.map(function (x) { return [x, x]; });
  }
  function getModelList(slot) { return MODELS[slot] || []; }
  /* 保存的模型在当前 ComfyUI 里已经不存在 → 自动切到可用项，并记下来提示用户保存；
     读不到列表（离线）时一律不动，避免把设置改成空。 */
  function alignModels() {
    MODEL_FIXED = [];
    if (!MODELS.loaded || MODELS.error) return;
    Object.keys(MODEL_SLOT).forEach(function (k) {
      var list = getModelList(MODEL_SLOT[k]);
      if (!list.length) return;
      var cur = String((STATE.settings || {})[k] || "").trim();
      if (!cur || list.indexOf(cur) >= 0) return;
      var pick;
      if (k === "h3Lora") {
        pick = "";                                   /* LoRA 可选：文件没了就先不挂 */
      } else {
        var def = MODEL_DEFAULTS[k] || "";
        pick = list.indexOf(def) >= 0 ? def : list[0];
      }
      STATE.settings[k] = pick;
      MODEL_FIXED.push({ name: MODEL_LABEL[k], detail: "「" + cur + "」→「" + (pick || "不挂") + "」" });
    });
    if (MODEL_FIXED.length) markDirty();
  }
  function applyModels(j) {
    MODELS.unet = j.unet || []; MODELS.lora = j.lora || [];
    MODELS.clip = j.clip || []; MODELS.vae = j.vae || [];
    MODELS.error = j.error || ""; MODELS.ts = j.ts || ""; MODELS.loaded = true;
    MODELS.at = Date.now();
    alignModels();
  }
  /* 每次都向本地服务现读一遍（服务端不缓存，浏览器也不缓存） */
  function loadModels(silent) {
    if (!SERVER) { MODELS.loaded = true; return; }
    return fetch("/api/models?force=1&t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        applyModels(j);
        if (page === "assets" || page === "prompts") render();
        if (silent) return;
        if (MODEL_FIXED.length) toast(MODEL_FIXED.map(function (x) { return x.name + " " + x.detail; }).join("；") + "（已切到可用模型，记得保存）", 6500);
        else toast("模型列表已刷新：主模型 " + MODELS.unet.length + " / LoRA " + MODELS.lora.length +
          " / CLIP " + MODELS.clip.length + " / VAE " + MODELS.vae.length);
      })
      .catch(function (e) {
        MODELS.loaded = true;
        MODELS.error = (e && e.message) || "服务没响应";
        if (page === "assets" || page === "prompts") render();
      });
  }

  function field(label, path, o) {

      inp = h("select");
      (o.options || []).forEach(function (v) {
        var pair = Array.isArray(v) ? v : [v, v];
        var op = h("option", null, pair[1]); op.value = pair[0]; inp.appendChild(op);
      });
      inp.value = get(path) || "";
      if (inp.selectedIndex < 0) inp.selectedIndex = 0;
      inp.addEventListener("change", function () { set(path, inp.value); markDirty(); if (o.onchange) o.onchange(inp.value); });
    } else if (o.type === "number") {
      inp = h("input"); inp.type = "number";
      if (o.step) inp.step = o.step;
      if (o.min != null) inp.min = o.min;
      if (o.max != null) inp.max = o.max;
      var v0 = get(path); inp.value = (v0 == null ? "" : v0);
      inp.addEventListener("input", function () {
        var v = inp.value === "" ? "" : Number(inp.value);
        /* integer: 只收整数（步数这类参数填 25.5 会被取整，避免把小数塞进 KSampler） */
        if (o.integer && v !== "" && isFinite(v)) v = Math.round(v);

      });
      inp.addEventListener("change", function () {
        if (!o.integer) return;          /* 只对整数项做取整 + 越界夹取，其它数字项行为不变 */
        if (inp.value === "") return;
        var v = Number(inp.value);
        if (!isFinite(v)) return;
        v = Math.round(v);
        if (o.min != null && v < o.min) v = Number(o.min);
        if (o.max != null && v > o.max) v = Number(o.max);
        inp.value = v; set(path, v); markDirty();

    } else if (o.type === "check") {

      /* --- 随机种 + 生成后控制 --- */
      var seedBox = h("div", "field");
      seedBox.appendChild(h("label", null, "随机种（0 = 每次随机）"));
      var row = h("div", "tools");
      var seedInp = h("input");
      seedInp.type = "number"; seedInp.min = "0"; seedInp.value = (STATE.settings.seed == null ? 0 : STATE.settings.seed);
      seedInp.style.maxWidth = "170px";
      seedInp.oninput = function () {
        STATE.settings.seed = seedInp.value === "" ? 0 : Number(seedInp.value); markDirty();
      };
      var rnd = h("button", "btn sm", "换一个");
      rnd.onclick = function () {
        seedInp.value = Math.floor(Math.random() * 2147482000) + 1;
        STATE.settings.seed = Number(seedInp.value); markDirty();
      };
      row.appendChild(seedInp); row.appendChild(rnd);
      seedBox.appendChild(row);
      seedBox.appendChild(h("div", "hint", "每段按这个种子出片；批量时按下面的「生成后控制」往后推"));
      g.appendChild(seedBox);
      g.appendChild(field("生成后控制", "settings.afterGenerate", { type: "select", options: SEED_MODES, hint: "默认固定：同一批共用起始种子，重跑结果可复现" }));

      var tools2 = h("div", "tools");
      var rf = h("button", "btn sm", "刷新模型列表");
      rf.onclick = function () {
        toast("正在重新读取 ComfyUI 模型…");
        loadModels(false);
      };
      tools2.appendChild(rf);
      g.appendChild(h("div", "field")).appendChild(tools2);

      g.appendChild(field("宽高比", "settings.ratio", { type: "select", options: RATIOS, hint: "短剧建议 9:16" }));
      g.appendChild(field("分辨率（百万像素）", "settings.megapixels", { type: "number", step: 0.1, min: 0.2, max: 4, hint: "9:16 · 0.9 ≈ 704×1280" }));
      g.appendChild(field("生成步数", "settings.steps", { type: "number", step: 1, min: 1, max: 60, hint: "默认 5（turbo_v4 蒸馏 LoRA 按 5 步走）" }));

      /* --- 二采高清放大：默认关闭，打开后一采完成再做一次 latent 放大 + 低强度精修 --- */
      var hdOn = !!STATE.settings.h3Hd;
      g.appendChild(field("MiniMax H3 二采高清放大", "settings.h3Hd", {
        type: "check",
        checkLabel: "开启二采（关着只跑一采）",
        hint: "关：一次采样出片，最快、最省显存。开：一采完成后再做一次 latent 放大，按目标像素补细节，人脸和远景更实；每段耗时会明显变长。",
        onchange: function (on) {
          var i = hdField && hdField.querySelector("input");
          if (i) { i.disabled = !on; i.style.opacity = on ? "1" : ".5"; }
        }
      }));
      var hdField = field("二采目标像素（MP）", "settings.h3HdMegapixels", {
        type: "number", step: 0.1, min: 1, max: 4,
        hint: hdOn ? "默认 1.5。一采是 " + (STATE.settings.megapixels || 0.7) + " MP，二采把它放大到这个像素再精修一轮" : "开关关闭时这一项不生效"
      });
      var hdInp = hdField.querySelector("input");
      if (hdInp) { hdInp.disabled = !hdOn; hdInp.style.opacity = hdOn ? "1" : ".5"; }
      g.appendChild(hdField);
    }));

    v.appendChild(voiceSummary());

    if (!segs().length) v.appendChild(h("div", "empty", "还没有分段提示词。"));
    segs().forEach(function (s, si) { v.appendChild(promptCard(s, si)); });

    if (segs().length) {
      var t = h("div", "tools");
      t.appendChild(saveBtn("保存全部提示词"));
      var all = h("button", "btn", "整批生成全部视频");
      all.onclick = function () { runTask("videos", []); };
      t.appendChild(all);
      v.appendChild(t);
    }
    return v;
  }

  /* ---------- 页面：成品 ---------- */
  function renderFinal() {
    var v = h("section", "page");
    v.appendChild(pageHead("成品", "全部段落跑完后自动拼成一个整片放在最上面，可以直接看完整条；下面仍是各段原片。生成时整批入队，ComfyUI 连续跑，模型只加载一次。"));
    v.appendChild(flowbar());
    var dirBar = h("div", "tools");
    dirBar.style.margin = "12px 0 2px";
    var openBtn = h("button", "btn", "打开本剧目录");
    openBtn.title = "在资源管理器里打开 " + PROJECT_DIR;
    openBtn.onclick = function () { openProjectDir(openBtn); };
    dirBar.appendChild(openBtn);
    var dirHint = h("span", "hint", "输出：" + PROJECT_DIR);
    dirHint.style.marginTop = "0";
    dirBar.appendChild(dirHint);
    v.appendChild(dirBar);
    var done = segs().filter(function (s) { return !!s.video; });
    var all = segs();
    /* 成片：全部合并好的整片，放在最上面给人一次看完 */
    var fin = finalUrl();
    if (fin) {
      var box = h("div", "finbox");
      var vd = h("video");
      vd.src = fin; vd.controls = true; vd.preload = "metadata"; vd.playsInline = true;
      box.appendChild(vd);
      var head = h("div", "finhead");
      head.appendChild(h("span", "t", "成片（整片）"));
      var parts = ((STATE.meta || {}).finalVideoParts || []).length;
      var meta = [];
      if (parts) meta.push(parts + " 段合并");
      if (finalSecs()) meta.push(finalSecs());
      if (meta.length) head.appendChild(h("span", "tag", meta.join(" · ")));
      var dlf = h("a", "btn sm", "下载整片");
      dlf.href = fin; dlf.download = ((STATE.meta || {}).finalVideo || "final.mp4").split("/").pop();
      head.appendChild(dlf);
      var at = (STATE.meta || {}).finalVideoAt;
      if (at) head.appendChild(h("span", "hint", "合并于 " + at));
      box.appendChild(head);
      v.appendChild(box);
    }
    if (!done.length) {
      v.appendChild(h("div", "empty", "还没有生成的视频。先到「视频提示词」页确认提示词与配音，再点生成。"));
    } else {
      var grid = h("div", "vgrid");
      done.forEach(function (s) {
        var card = h("div", "vcard");
        var wrap = h("div", "vwrap");
        var vid = h("video");
        vid.src = videoUrl(s); vid.controls = true; vid.preload = "metadata"; vid.playsInline = true;
        wrap.appendChild(vid);
        card.appendChild(wrap);
        var vb = h("div", "vb");
        vb.appendChild(h("span", "id", s.id));
        vb.appendChild(h("span", "tag", (s.title || "") + " · " + (s.sec || "?") + "s"));
        var dl = h("a", "btn sm", "下载");
        dl.href = videoUrl(s); dl.download = (s.id || "seg") + ".mp4";
        vb.appendChild(dl);
        card.appendChild(vb);
        grid.appendChild(card);
      });
      v.appendChild(grid);
    }
    if (all.length) {
      var rest = all.length - done.length;
      var t = h("div", "tools"); t.style.marginTop = "16px";
      t.appendChild(h("span", "hint", "共 " + all.length + " 段，已生成 " + done.length + " 段" + (rest ? "，还差 " + rest + " 段" : "")));
      if (rest) {
        var go = h("button", "btn primary", "整批补齐剩余 " + rest + " 段");
        go.onclick = function () { runTask("videos", []); };
        t.appendChild(go);
      } else if (done.length >= 2) {
        var mg = h("button", "btn", fin ? "重新合并成片" : "合并成片");
        mg.onclick = function () { runTask("merge", []); };
        t.appendChild(mg);
      }
      v.appendChild(t);
    }
    return v;
  }

  /* ---------- 渲染 ---------- */
  var RENDER = { synopsis: renderSynopsis, assets: renderAssets, prompts: renderPrompts, final: renderFinal };
  function render() {
    stat();
    document.querySelectorAll("#nav button").forEach(function (b) {
      b.classList.toggle("on", b.dataset.page === page);
    });
    var view = document.getElementById("view");
    view.innerHTML = "";
    view.appendChild(RENDER[page]());
  }

  document.getElementById("nav").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-page]");
    if (!b) return;
    page = b.dataset.page;
    if (history.replaceState) history.replaceState(null, "", "#" + page);
    render();
    window.scrollTo(0, 0);
    /* 进「资产 / 视频提示词」页就重新读一次模型：中途删了模型，下拉立刻跟上 */
    if (SERVER && (page === "assets" || page === "prompts") && Date.now() - (MODELS.at || 0) > 2000) loadModels(true);
  });
  document.getElementById("saveAll").onclick = function () { saveAll(false); };
  document.getElementById("reloadBtn").onclick = function () {
    document.getElementById("banner").classList.remove("on");
    reloadState();
  };
  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); saveAll(false); }
  });
  window.addEventListener("beforeunload", function (e) {
    if (isDirty) { e.preventDefault(); e.returnValue = ""; }
  });

  document.getElementById("modeHint").textContent = SERVER
    ? "已连接本地服务，保存直接写回项目"
    : "文件模式：保存会下载 json，需要交给 AI";

  render();
  if (SERVER) {
    /* 页面每次打开都现读一次 ComfyUI 的模型目录（服务端不缓存、浏览器也不缓存） */
    loadModels(true);
    setInterval(checkDisk, 8000);
  }
})();
</script>
</body>
</html>
